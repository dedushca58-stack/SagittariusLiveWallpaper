plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.aquamotion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.aquamotion'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Keep the MP4 as an uncompressed asset so AssetFileDescriptor can open it.
    androidResources {
        noCompress 'mp4'
    }
}
